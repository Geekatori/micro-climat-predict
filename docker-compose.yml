version: "3.8"

services:
  data-collector:
    build: ./data-collector
    container_name: data-collector
    volumes:
      - data-volume:/app/data
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - LAT=${LAT}
      - LON=${LON}
    networks:
      - meteo_network

  ml-engine:
    build: ./ml-engine
    container_name: ml-engine
    restart: unless-stopped
    volumes:
      - data-volume:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - meteo_network

  web-ui:
    build: ./web-ui
    container_name: web-ui
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - data-volume:/app/data
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
    networks:
      - meteo_network

  cron:
    image: alpine
    container_name: scheduler
    command: >
      /bin/sh -c "echo '*/30 * * * * wget -qO- http://data-collector:8000/api/collect' > /etc/crontabs/root &&
                  echo '0 3 * * * wget -qO- http://ml-engine:8000/api/train' >> /etc/crontabs/root &&
                  crond -f -l 8"
    networks:
      - meteo_network

networks:
  meteo_network:
    driver: bridge

volumes:
  data-volume: