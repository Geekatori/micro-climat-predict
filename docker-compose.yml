# Fork de micro-climat-predict (jmfavreau, AGPL-3.0). Les différences avec l'amont
# sont listées dans README.md.

# Sonde commune aux trois services FastAPI. Les images python:3.11-slim n'ont ni curl
# ni wget. `/openapi.json` prouve que uvicorn a chargé l'application avec ses routes.
# Pas `/` : le collecteur et le moteur n'ont pas de route racine, et urlopen lève sur
# un 404. Pas /api/status/* : ces routes lisent SQLite et clignoteraient pendant
# l'entraînement.
x-healthcheck: &healthcheck
  test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
  interval: 60s
  timeout: 5s
  retries: 3

# `always` et non `unless-stopped` : sur Unraid, l'arrêt de l'array fait un `docker
# stop` explicite, et un conteneur `unless-stopped` arrêté ainsi ne repart pas au boot
# suivant. Le label d'icône Unraid est sans effet quand UNRAID_ICON_URL est vide.
x-common: &common
  restart: always
  networks:
    - meteo_network
  labels:
    net.unraid.docker.icon: "${UNRAID_ICON_URL:-}"

services:
  data-collector:
    <<: *common
    build: ./data-collector
    container_name: mcp-data-collector
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-8732}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - LAT=${LAT}
      - LON=${LON}
      - EXT_ENTITY=${EXT_ENTITY}
      - HUM_ENTITY=${HUM_ENTITY}
      - INT_TEMP_ENTITY=${INT_TEMP_ENTITY}
      - INT_HUM_ENTITY=${INT_HUM_ENTITY}
      - HA_COR_TEMP=${HA_COR_TEMP}
      - COR_HUM_ENTITY=${COR_HUM_ENTITY}
      - CO2_ENTITY=${CO2_ENTITY:-}
      - STOVE_POWER_ENTITY=${STOVE_POWER_ENTITY:-}
    healthcheck: *healthcheck

  ml-engine:
    <<: *common
    build: ./ml-engine
    container_name: mcp-ml-engine
    ports:
      - "127.0.0.1:${ML_PORT:-8731}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LAT=${LAT}
      - LON=${LON}
      # Vide = valeur par défaut. Le mode saisonnier n'est pas une variable
      # d'environnement : il se règle depuis /admin et vit dans data/season.json.
      - INT_HOT_THRESHOLD_C=${INT_HOT_THRESHOLD_C:-}
      - FAVORABLE_MARGIN_CHAUD=${FAVORABLE_MARGIN_CHAUD:-}
      - FAVORABLE_MARGIN_FROID=${FAVORABLE_MARGIN_FROID:-}
    healthcheck: *healthcheck

  web-ui:
    <<: *common
    build: ./web-ui
    container_name: mcp-web-ui
    ports:
      # WEB_BIND : 127.0.0.1 en local, adresse du serveur pour ouvrir l'interface au
      # LAN. Le moteur et le collecteur restent sur la boucle locale.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8730}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ML_ENGINE_URL=http://ml-engine:8000
      - COLLECTOR_URL=http://data-collector:8000
      - EXT_ENTITY=${EXT_ENTITY}
      - HUM_ENTITY=${HUM_ENTITY}
      - HA_INTERIOR_TEMP_MIN=${HA_INTERIOR_TEMP_MIN}
      - INT_HUM_ENTITY=${INT_HUM_ENTITY}
      - HA_COR_TEMP=${HA_COR_TEMP}
      - CO2_ENTITY=${CO2_ENTITY:-}
      # Qualité de l'air : le web-ui interroge Open-Meteo directement.
      - LAT=${LAT}
      - LON=${LON}
      - HA_SENSOR_PREFIX=${HA_SENSOR_PREFIX:-micro_climat}
      - HA_PUBLISH_HORIZON_HOURS=${HA_PUBLISH_HORIZON_HOURS:-6}
    healthcheck: *healthcheck
    labels:
      net.unraid.docker.icon: "${UNRAID_ICON_URL:-}"
      # `[IP]` et `[PORT:8730]` sont des gabarits substitués par Unraid.
      net.unraid.docker.webui: "http://[IP]:[PORT:8730]/"

  cron:
    <<: *common
    # Image construite localement : tzdata dans l'image, voir scheduler/Dockerfile.
    build: ./scheduler
    container_name: mcp-scheduler
    environment:
      - TZ=${TZ:-Europe/Paris}
    command: >
      /bin/sh -c "echo '8,38 * * * * wget -qO- http://data-collector:8000/api/collect' > /etc/crontabs/root &&
                  echo '12,42 * * * * wget -qO- http://web-ui:8000/api/publish-ha' >> /etc/crontabs/root &&
                  echo '30 5 * * * wget -qO- --post-data= http://ml-engine:8000/api/train' >> /etc/crontabs/root &&
                  chmod 0600 /etc/crontabs/root &&
                  crond -f -d 8"

networks:
  meteo_network:
    driver: bridge
