# Fork de micro-climat-predict (jmfavreau, AGPL-3.0) adapté à la stack de Mathieu.
# Différences avec l'amont : ports liés à 127.0.0.1 et hors plages courantes,
# base SQLite en bind mount ./data
# (sauvegardable), LAT/LON transmis au ml-engine, entités HA configurables via .env.

services:
  data-collector:
    build: ./data-collector
    # `always` et non `unless-stopped` : sur Unraid, l'arrêt de l'array fait un
    # `docker stop` par conteneur, et un `unless-stopped` arrêté explicitement ne
    # repart pas au démarrage suivant — donc plus de publication vers Home
    # Assistant après un reboot, sans aucune erreur. Constat 1 de l'audit du 09/09.
    restart: always
    container_name: mcp-data-collector
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-8732}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - LAT=${LAT}
      - LON=${LON}
      - EXT_ENTITY=${EXT_ENTITY}
      - HUM_ENTITY=${HUM_ENTITY}
      - INT_TEMP_ENTITY=${INT_TEMP_ENTITY}
      - INT_HUM_ENTITY=${INT_HUM_ENTITY}
      - HA_COR_TEMP=${HA_COR_TEMP}
      - COR_HUM_ENTITY=${COR_HUM_ENTITY}
      - CO2_ENTITY=${CO2_ENTITY:-}
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/python.png"
    networks:
      - meteo_network

  ml-engine:
    build: ./ml-engine
    container_name: mcp-ml-engine
    restart: always   # voir data-collector ci-dessus (audit 09/09, constat 1)
    ports:
      - "127.0.0.1:${ML_PORT:-8731}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LAT=${LAT}
      - LON=${LON}
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/python.png"
    networks:
      - meteo_network

  web-ui:
    build: ./web-ui
    container_name: mcp-web-ui
    restart: always   # voir data-collector ci-dessus (audit 09/09, constat 1)
    ports:
      # WEB_BIND : 127.0.0.1 en local, adresse du serveur sur Tower pour
      # rendre l'interface joignable depuis le LAN. Le moteur et le
      # collecteur restent volontairement sur la boucle locale.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8730}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - ML_ENGINE_URL=http://ml-engine:8000
      - COLLECTOR_URL=http://data-collector:8000
      - EXT_ENTITY=${EXT_ENTITY}
      - HUM_ENTITY=${HUM_ENTITY}
      - HA_INTERIOR_TEMP_MIN=${HA_INTERIOR_TEMP_MIN}
      - INT_HUM_ENTITY=${INT_HUM_ENTITY}
      - HA_COR_TEMP=${HA_COR_TEMP}
      - CO2_ENTITY=${CO2_ENTITY:-}
      - PM25_ENTITY=${PM25_ENTITY:-}
      - PM10_ENTITY=${PM10_ENTITY:-}
      - HA_SENSOR_PREFIX=${HA_SENSOR_PREFIX:-micro_climat}
      - HA_PUBLISH_HORIZON_HOURS=${HA_PUBLISH_HORIZON_HOURS:-6}
    # Icône et bouton WebUI dans l'onglet Docker d'Unraid (constat 11). `[IP]` et
    # `[PORT:8730]` sont des gabarits substitués par Unraid : ne pas les remplacer
    # par une adresse en dur.
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8730]/"
    networks:
      - meteo_network

  cron:
    image: alpine:3.20
    restart: always   # voir data-collector ci-dessus (audit 09/09, constat 1)
    container_name: mcp-scheduler
    environment:
      # tzdata + TZ : sans ca busybox crond raisonne en UTC et l'entrainement
      # deriverait de deux heures en ete, d'une heure en hiver.
      - TZ=${TZ:-Europe/Paris}
    command: >
      /bin/sh -c "apk add --no-cache tzdata >/dev/null 2>&1 || true;
                  echo '8,38 * * * * wget -qO- http://data-collector:8000/api/collect' > /etc/crontabs/root &&
                  echo '12,42 * * * * wget -qO- http://web-ui:8000/api/publish-ha' >> /etc/crontabs/root &&
                  echo '30 5 * * * wget -qO- --post-data= http://ml-engine:8000/api/train' >> /etc/crontabs/root &&
                  chmod 0600 /etc/crontabs/root &&
                  crond -f -d 8"
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/alpine-linux.png"
    networks:
      - meteo_network

networks:
  meteo_network:
    driver: bridge
