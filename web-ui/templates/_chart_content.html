<div id="cards-container" class="grid gap-1.5 md:gap-4 mb-2">
    <!-- Dynamically generated -->
</div>

<!-- Alert Banner / Inversion -->
<div id="alert-banner" class="hidden mb-2 p-2.5 bg-blue-900/40 border border-blue-700/50 rounded-xl text-xs text-blue-200 flex justify-between items-center">
    <span id="alert-message">--</span>
    <span id="opening-time-badge" class="bg-blue-600 px-2 py-0.5 rounded text-white font-semibold shadow">--</span>
</div>

<div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow flex-grow relative flex flex-col min-h-[400px]">
    <!-- Top Toolbar -->
    <div class="flex flex-wrap justify-between items-center mb-3 gap-2 pb-2 border-b border-gray-700/60">
        <div class="text-xs font-semibold text-gray-300">Contrôles du graphique</div>
        <div class="flex flex-wrap items-center gap-3">

            <!-- Switch ML (Past / Future) -->
            <label class="relative inline-flex items-center cursor-pointer select-none">
                <input type="checkbox" id="switch-ml" class="sr-only peer">
                <div class="w-8 h-4 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-purple-600 border border-gray-600"></div>
                <span class="ml-1.5 text-[11px] text-gray-300">Passé (ML)</span>
            </label>

            <!-- Switch Mode (Simple / Detailed) -->
            <label class="relative inline-flex items-center cursor-pointer select-none">
                <input type="checkbox" id="switch-mode" class="sr-only peer">
                <div class="w-8 h-4 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600 border border-gray-600"></div>
                <span class="ml-1.5 text-[11px] text-gray-300">Détaillé</span>
            </label>

            <!-- 3-position Zoom Slider -->
            <div class="flex bg-gray-900/80 p-0.5 rounded-lg border border-gray-700/80 items-center text-[11px] font-medium ml-auto">
                <button type="button" onclick="setZoomMode('zoom4h')" id="btn-zoom-4h" class="px-2.5 py-1 rounded-md transition-all duration-200 text-gray-400 hover:text-white">±4h</button>
                <button type="button" onclick="setZoomMode('24h')" id="btn-zoom-24h" class="px-2.5 py-1 rounded-md transition-all duration-200 text-gray-400 hover:text-white">24h</button>
                <button type="button" onclick="setZoomMode('7d')" id="btn-zoom-7d" class="px-2.5 py-1 rounded-md transition-all duration-200 text-gray-400 hover:text-white">7j</button>
            </div>
        </div>
    </div>

    <div id="chart" class="w-full flex-grow"></div>

    <span id="data-freshness" class="absolute bottom-2 right-4 text-[9px] md:text-[10px] text-gray-500 italic hidden pointer-events-none">
        Données : --
    </span>
</div>

<script>
    // --- Data Store to handle caching and partial fetching ---
    class MeteoDataStore {
        constructor() {
            this.historySeries = null;
            this.currentValues = null;
            this.forecastSeries = null;
            this.analysisData = null;

            this.loadedHistoryRange = null;
            this.loadedMode = null;
            this.loadedMlMode = null;
        }

        async loadRequiredData(range, mode, mlMode, forceRefresh = false) {
            const promises = [];

            // 1. History check
            const needsHistory = forceRefresh || !this.historySeries || this.loadedHistoryRange !== range || this.loadedMode !== mode;
            if (needsHistory) {
                promises.push(
                    fetch(`/api-meteo/history/${range}?mode=${mode}`)
                        .then(res => res.json())
                        .then(data => {
                            this.historySeries = data.series || [];
                            this.currentValues = data.current || {};
                            this.loadedHistoryRange = range;
                            this.loadedMode = mode;
                        })
                );
            }

            // 2. Forecast check
            const needsForecast = forceRefresh || !this.forecastSeries || this.loadedMlMode !== mlMode;
            if (needsForecast) {
                promises.push(
                    fetch(`/api-meteo/forecast?ml=${mlMode}`)
                        .then(res => res.json())
                        .then(data => {
                            this.forecastSeries = data.series || [];
                            this.loadedMlMode = mlMode;
                        })
                );
            }

            // 3. Analysis check (quick fetch, always run on refresh or if empty)
            const needsAnalysis = forceRefresh || !this.analysisData;
            if (needsAnalysis) {
                promises.push(
                    fetch(`/api-meteo/analysis`)
                        .then(res => res.json())
                        .then(data => {
                            this.analysisData = data;
                        })
                );
            }

            if (promises.length > 0) {
                await Promise.all(promises);
            }

            return {
                series: [...(this.historySeries || []), ...(this.forecastSeries || [])],
                current: this.currentValues,
                inversion_time: this.analysisData?.inversion_time,
                peak_message: this.analysisData?.peak_message,
                generated_at: new Date().toISOString()
            };
        }
    }

    const dataStore = new MeteoDataStore();

    // --- State Initialization ---
    let urlParams = new URLSearchParams(window.location.search);
    let currentZoomMode = urlParams.get('v') === '7d' ? '7d' : (urlParams.get('zoom') === '4h' ? 'zoom4h' : '24h');
    let mode = urlParams.get('mode') === 'detailed' ? 'detailed' : 'simple';
    let mlMode = urlParams.get('ml') === 'eval' ? 'eval' : 'forecast';
    let chart = null;

    document.getElementById('switch-ml').checked = (mlMode === 'eval');
    document.getElementById('switch-mode').checked = (mode === 'detailed');
    updateZoomButtonsUI();

    // --- Event Listeners ---
    document.getElementById('switch-ml').addEventListener('change', (e) => {
        mlMode = e.target.checked ? 'eval' : 'forecast';
        updateUrlState();
        loadData(false);
    });

    document.getElementById('switch-mode').addEventListener('change', (e) => {
        mode = e.target.checked ? 'detailed' : 'simple';
        updateUrlState();
        loadData(false);
    });

    function setZoomMode(targetMode) {
        if (currentZoomMode === targetMode) return;
        currentZoomMode = targetMode;

        updateZoomButtonsUI();
        updateUrlState();
        loadData(false);
    }

    // --- Core Data Loading ---
    async function loadData(forceRefresh = false) {
        let apiVersion = (currentZoomMode === '7d') ? '7d' : '24h';

        try {
            // DataStore handles deciding if HTTP calls are needed
            const data = await dataStore.loadRequiredData(apiVersion, mode, mlMode, forceRefresh);

            // Update Page Title
            let titleText = `Ext: ${data.current.ext || '--'}`;
            if (mode === 'detailed') {
                titleText += ` | Couloir: ${data.current.cor || '--'} | Int: ${data.current.int || '--'}`;
            } else {
                titleText += ` | Int: ${data.current.int || '--'}`;
            }
            document.title = titleText;

            // Update Freshness Indicator
            const freshEl = document.getElementById('data-freshness');
            if (freshEl && data.generated_at) {
                let d = new Date(data.generated_at);
                let timeStr = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                freshEl.innerText = `Mis à jour à ${timeStr}`;
                freshEl.style.display = 'block';
            }

            processAndRenderChart(data);

        } catch (err) {
            console.error("Error loading data:", err);
        }
    }

    // --- UI Update Helpers ---
    function updateUrlState() {
        const p = new URLSearchParams(window.location.search);
        p.set('v', currentZoomMode === '7d' ? '7d' : '24h');
        if (currentZoomMode === 'zoom4h') p.set('zoom', '4h');
        else p.delete('zoom');
        p.set('mode', mode);
        p.set('ml', mlMode);
        window.history.replaceState({}, '', `?${p.toString()}`);
    }

    function updateZoomButtonsUI() {
        ['4h', '24h', '7d'].forEach(z => {
            const btn = document.getElementById(`btn-zoom-${z}`);
            if (!btn) return;
            const isActive = (currentZoomMode === 'zoom4h' && z === '4h') ||
                             (currentZoomMode === '24h' && z === '24h') ||
                             (currentZoomMode === '7d' && z === '7d');

            if (isActive) {
                btn.className = "px-2.5 py-1 rounded-md transition-all duration-200 bg-blue-600 text-white font-bold shadow-sm";
            } else {
                btn.className = "px-2.5 py-1 rounded-md transition-all duration-200 text-gray-400 hover:text-white";
            }
        });
    }

    function renderCards(current) {
        const container = document.getElementById('cards-container');
        if (!container) return;

        if (mode === 'detailed') {
            container.className = "grid grid-cols-3 gap-1.5 md:gap-4 mb-2";
            container.innerHTML = `
                <div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow flex justify-between items-center">
                    <div>
                        <p class="text-[10px] md:text-xs text-gray-400">Extérieur</p>
                        <h3 id="val-ext" class="text-base md:text-xl font-bold text-[#f39c12]">${current.ext}</h3>
                    </div>
                </div>
                <div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow">
                    <p class="text-[10px] md:text-xs text-gray-400">Couloir</p>
                    <h3 id="val-cor" class="text-base md:text-xl font-bold text-[#3498db]">${current.cor}</h3>
                </div>
                <div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow flex justify-between items-center">
                    <div>
                        <p class="text-[10px] md:text-xs text-gray-400">Intérieur</p>
                        <h3 id="val-int" class="text-base md:text-xl font-bold text-[#e74c3c]">${current.int}</h3>
                    </div>
                </div>
            `;
        } else {
            container.className = "grid grid-cols-2 gap-1.5 md:gap-4 mb-2";
            container.innerHTML = `
                <div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow flex justify-between items-center">
                    <div>
                        <p class="text-[10px] md:text-xs text-gray-400">Extérieur</p>
                        <h3 id="val-ext" class="text-base md:text-xl font-bold text-[#f39c12]">${current.ext}</h3>
                    </div>
                </div>
                <div class="bg-gray-800 p-2 md:p-4 rounded-xl border border-gray-700 shadow flex justify-between items-center">
                    <div>
                        <p class="text-[10px] md:text-xs text-gray-400">Intérieur min</p>
                        <h3 id="val-int" class="text-base md:text-xl font-bold text-[#a855f7]">${current.int}</h3>
                    </div>
                </div>
            `;
        }
    }

    function updateAlertBanner(peakMsg, inversionTime) {
        const banner = document.getElementById('alert-banner');
        const msgEl = document.getElementById('alert-message');
        const badgeEl = document.getElementById('opening-time-badge');

        if (!banner) return;

        if (!peakMsg) {
            banner.classList.add('hidden');
            return;
        }

        banner.classList.remove('hidden');
        msgEl.innerText = peakMsg;

        if (inversionTime) {
            const d = new Date(inversionTime);
            const timeStr = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            badgeEl.innerText = `Ouvrir à ${timeStr}`;
            badgeEl.style.display = 'inline-block';
        } else {
            badgeEl.style.display = 'none';
        }
    }

    // --- Chart Helpers ---
    function getDynamicAnnotations(minTime, maxTime, inversionTime) {
        let annotations = [];
        let now = new Date();

        for (let i = -30; i <= 7; i++) {
            let d = new Date(now);
            d.setDate(d.getDate() + i);
            d.setHours(0, 0, 0, 0);
            let timeVal = d.getTime();

            if (timeVal >= minTime && timeVal <= maxTime) {
                annotations.push({
                    x: timeVal,
                    borderColor: '#4b5563',
                    strokeDashArray: 4,
                    label: {
                        text: d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }),
                        style: { color: '#e5e7eb', background: '#1f2937', fontSize: '11px', padding: { left: 5, right: 5, top: 2, bottom: 2 } },
                        orientation: 'horizontal',
                        offsetY: 0
                    }
                });
            }
        }

        if (inversionTime) {
            let invDate = new Date(inversionTime);
            let invTimeMs = invDate.getTime();

            if (invTimeMs >= minTime && invTimeMs <= maxTime) {
                annotations.push({
                    x: invTimeMs,
                    borderColor: '#3b82f6',
                    strokeDashArray: 0,
                    borderWidth: 2,
                    label: {
                        text: 'Ouverture : ' + invDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
                        style: { color: '#ffffff', background: '#2563eb', fontSize: '11px', padding: { left: 6, right: 6, top: 4, bottom: 4 }, fontWeight: 'bold' },
                        orientation: 'horizontal',
                        offsetY: 25
                    }
                });
            }
        }
        return annotations;
    }

    function interpolateValue(dataArray, targetTime) {
        if (!dataArray || dataArray.length === 0) return null;
        if (targetTime < dataArray[0][0] || targetTime > dataArray[dataArray.length - 1][0]) return null;

        for (let i = 0; i < dataArray.length - 1; i++) {
            let p1 = dataArray[i];
            let p2 = dataArray[i + 1];
            if (targetTime >= p1[0] && targetTime <= p2[0]) {
                let t1 = p1[0], v1 = p1[1];
                let t2 = p2[0], v2 = p2[1];
                if (t1 === t2) return v1;
                let interpolated = v1 + (v2 - v1) * (targetTime - t1) / (t2 - t1);
                return Math.round(interpolated * 10) / 10;
            }
        }
        return null;
    }

    function processAndRenderChart(data) {
        renderCards(data.current);
        updateAlertBanner(data.peak_message, data.inversion_time);

        let seriesData = data.series || [];
        let now = Date.now();
        let minTime, maxTime;

        // Visual limits adjustment based on zoom mode
        if (currentZoomMode === '24h') {
            minTime = now - (24 * 3600 * 1000);
            maxTime = mlMode === 'forecast' ? now + (24 * 3600 * 1000) : now + (2 * 3600 * 1000);
        } else if (currentZoomMode === 'zoom4h') {
            let windowMs = 4 * 3600 * 1000;
            minTime = now - windowMs;
            maxTime = mlMode === 'forecast' ? now + windowMs * 2 : now + windowMs;
        } else if (currentZoomMode === '7d') {
            minTime = now - (7 * 24 * 3600 * 1000);
            maxTime = mlMode === 'forecast' ? now + (2 * 24 * 3600 * 1000) : now + (2 * 3600 * 1000);
        }

        const styleMap = {
            'Intérieur min': { color: '#a855f7', width: 2, dash: 0 },
            'Intérieur (Modèle prévu)': { color: '#a855f7', width: 2, dash: 5 },
            'Intérieur (Modèle passé)': { color: '#a855f7', width: 2, dash: 5 },
            'Intérieur': { color: '#e74c3c', width: 2, dash: 0 },
            'Couloir': { color: '#3498db', width: 2, dash: 0 },
            'Extérieur': { color: '#f39c12', width: 2, dash: 0 },
            'Extérieur (prévu)': { color: '#f39c12', width: 2, dash: 5 },
            'Extérieur (ML passé)': { color: '#f39c12', width: 2, dash: 5 },
            'Open-Meteo': { color: '#64748b', width: 1.5, dash: 5 }
        };

        let chartColors = [];
        let strokeWidths = [];
        let strokeDash = [];

        seriesData.forEach(s => {
            let cfg = styleMap[s.name] || { color: '#ffffff', width: 2, dash: 0 };
            chartColors.push(cfg.color);
            strokeWidths.push(cfg.width);
            strokeDash.push(cfg.dash);
        });

        let chartAnnotations = getDynamicAnnotations(minTime, maxTime, data.inversion_time);
        const chartContainer = document.querySelector("#chart");
        if (!chartContainer) return;
        const exactHeight = (chartContainer.clientHeight > 50 ? chartContainer.clientHeight : 400) - 15;

        if (chart) {
            chart.updateOptions({
                stroke: { curve: 'straight', width: strokeWidths, dashArray: strokeDash },
                colors: chartColors,
                xaxis: { min: minTime, max: maxTime, tickAmount: currentZoomMode === '7d' ? 7 : 12 },
                annotations: { xaxis: chartAnnotations },
                chart: { height: exactHeight }
            });
            chart.updateSeries(seriesData);
        } else {
            var options = {
                chart: {
                    type: 'line',
                    height: exactHeight,
                    background: 'transparent',
                    selection: { enabled: false },
                    zoom: { enabled: true, type: 'x', autoScaleYaxis: true, pinch: true },
                    pan: { enabled: true, mode: 'x', speed: 20, inertia: true },
                    toolbar: { show: true, autoSelected: 'pan' },
                    animations: { enabled: false } // Disabled to speed up zoom transitions
                },
                theme: { mode: 'dark' },
                series: seriesData,
                annotations: { xaxis: chartAnnotations },
                xaxis: {
                    type: 'datetime',
                    min: minTime,
                    max: maxTime,
                    tickAmount: currentZoomMode === '7d' ? 7 : 12,
                    labels: {
                        datetimeUTC: false,
                        formatter: function(val, timestamp) {
                            const ts = timestamp || val;
                            if (!ts) return '';
                            if (currentZoomMode === '7d') {
                                return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                            }
                            return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        },
                        style: { colors: '#9ca3af' }
                    },
                    axisBorder: { color: '#374151' },
                    axisTicks: { color: '#374151' }
                },
                yaxis: { labels: { style: { colors: '#9ca3af' } } },
                grid: { borderColor: 'rgba(255, 255, 255, 0.05)' },
                stroke: { curve: 'straight', width: strokeWidths, dashArray: strokeDash },
                colors: chartColors,
                tooltip: {
                    shared: true,
                    intersect: false,
                    custom: function({ series, seriesIndex, dataPointIndex, w }) {
                        let hoveredTimestamp = w.globals.seriesX[seriesIndex][dataPointIndex];
                        let d = new Date(hoveredTimestamp);
                        let dateStr = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
                        let timeStr = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        let title = `${dateStr} à ${timeStr}`;

                        let html = `<div class="custom-tooltip">
                                        <div class="custom-tooltip-title">${title}</div>`;

                        w.config.series.forEach((s, i) => {
                            let val = interpolateValue(s.data, hoveredTimestamp);
                            let displayVal = val !== null ? val.toFixed(1) + " °C" : "-";
                            let color = w.config.colors[i];

                            html += `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                        <div style="display: flex; align-items: center; gap: 6px;">
                                            <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${color}; display: inline-block;"></span>
                                            <span style="color: #e5e7eb;">${s.name}</span>
                                        </div>
                                        <span style="font-weight: bold; margin-left: 20px; color: ${val !== null ? '#fff' : '#6b7280'};">${displayVal}</span>
                                    </div>`;
                        });

                        html += `</div>`;
                        return html;
                    }
                }
            };
            chart = new ApexCharts(chartContainer, options);
            chart.render();
        }
    }

    // Initial load and interval refresh
    loadData(true);
    // Force a fresh fetch every 5 minutes (300000 ms)
    setInterval(() => loadData(true), 300000);
</script>

<style>
    .custom-tooltip {
        background: #1a1a1a;
        border: 1px solid #444;
        padding: 8px 12px;
        border-radius: 6px;
        color: #fff;
        font-size: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .custom-tooltip-title {
        font-weight: bold;
        margin-bottom: 6px;
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
        color: #ccc;
    }
    .apexcharts-toolbar {
        margin-top: -15px;
        margin-right: 0;
    }
</style>
