<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo & Intérieur - Synthèse</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta http-equiv="refresh" content="60">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 750px;
            width: 100%;
        }
        /* Grille pour mettre Extérieur et Intérieur côte à côte */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            justify-items: center;
            align-items: stretch;
        }
        .weather-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            padding: 1.5rem;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .temperature-wrapper {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 0.4rem;
        }
        .temperature {
            font-size: clamp(3.5rem, 10vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
        }
        .trend {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #38bdf8;
        }
        .label {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #94a3b8;
            margin-top: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }
        .details {
            margin-top: 1rem;
            font-size: clamp(0.9rem, 1.8vw, 1rem);
            color: #cbd5e1;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .timestamp {
            margin-top: 0.5rem;
            font-size: clamp(0.75rem, 1.2vw, 0.85rem);
            color: #64748b;
        }
        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 2rem 0;
        }
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 0.75rem;
        }
        .pollution-section {
            font-size: clamp(0.9rem, 1.8vw, 1.1rem);
            color: #cbd5e1;
        }
        .pollution-source {
            margin-top: 0.5rem;
            font-size: clamp(0.75rem, 1.2vw, 0.85rem);
            color: #64748b;
        }
        .pollution-source a, .about-link a {
            color: #38bdf8;
            text-decoration: none;
        }
        .pollution-source a:hover, .about-link a:hover {
            text-decoration: underline;
        }
        .about-link {
            margin-top: 2rem;
            font-size: clamp(0.75rem, 1.2vw, 0.85rem);
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Grille Extérieur / Intérieur côte à côte -->
        <div class="weather-grid">

            <!-- Carte Extérieur -->
            <div class="weather-card">
                <div>
                    <div class="temperature-wrapper">
                        <div class="temperature">{temperature}</div>
                        <div class="trend">{trend}</div>
                    </div>
                    <div class="label">Extérieur</div>
                </div>
                <div class="details">
                    <div>Humidité : <strong>{humidity}</strong></div>
                    <div class="timestamp">Mis à jour : {timestamp}</div>
                </div>
            </div>

            <!-- Carte Intérieur -->
            <div class="weather-card">
                <div>
                    <div class="temperature-wrapper">
                        <div class="temperature">{int_temp}</div>
                    </div>
                    <div class="label">Intérieur</div>
                </div>
                <div class="details">
                    <div>Humidité : <strong>{int_humidity}</strong></div>
                    <div>CO2 : <strong>{co2}</strong></div>
                </div>
            </div>

        </div>

        <div class="divider"></div>

        <!-- Bloc Pollution Externe -->
        <div class="section-title">Qualité de l'air extérieur</div>
        <div class="pollution-section">
            <div>PM2.5 : <strong>{pm25}</strong> &nbsp;|&nbsp; PM10 : <strong>{pm10}</strong></div>
            <div class="pollution-source">
                Données Atmo AuRA :
                <a href="https://www.atmo-auvergnerhonealpes.fr/dataviz/mesures-aux-stations?station_id=FR07004&polluant_id=03%2C08%2C24%2C39" target="_blank">détails</a>
            </div>
        </div>

        <!-- Lien Administration -->
        <div class="about-link">
            <a href="/admin">graphique</a> — <a href="/admin">administration</a>

        </div>
    </div>
</body>
</html>
